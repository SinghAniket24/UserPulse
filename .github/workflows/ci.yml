name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: userpulse
          POSTGRES_USER: userpulse
          POSTGRES_PASSWORD: userpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U userpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/userpulse
          SPRING_DATASOURCE_USERNAME: userpulse
          SPRING_DATASOURCE_PASSWORD: userpulse
